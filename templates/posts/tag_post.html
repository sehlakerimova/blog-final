{% extends "posts/base.html" %}

{% block content %}

<h1>Tag: {{ tag.title }}</h1>

<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'post' post.slug %}">
                {{ post.title }}
            </a>
        </li>
    {% empty %}
        <li>Bu tag üçün post yoxdur</li>
    {% endfor %}
</ul>

{% endblock %}
